# Pre-registration manifest — EXP-2026-06 (ROADMAP-2026-Q4 §9 P1)

Written BEFORE any code/run, per Issue A (multiple-testing control). The sealed
test set is scored exactly once; any re-run with changed assumptions requires a
new experiment ID (EXP-2026-06b) and a RUN_LOG entry marking this one superseded.

exp_id: EXP-2026-06-EURUSD-BUY-COSTLABEL
status: stop                    # go | hold | stop (2026-09-21: STOP — CI wholly below zero)
scored_at: 2026-09-21
verdict_evidence: reports/test_metrics.json  # ev=+/-0.111, CI [-0.197, -0.021], n=2003
forks_from: EXP-2026-05-EURUSD-SELL-COSTLABEL   # mirror (P0.1 pattern)

hypothesis:
  "The BUY-side EURUSD model, retrained on a cost-adjusted BUY label (TP must
   clear ATR barrier + round-trip friction), is PROFITABLE net of cost on the
   sealed test window — the counterpart to the SELL experiment (EXP-2026-05).
   BUY is tested sequentially after SELL's verdict per Issue A (no simultaneous
   two-direction multiple testing)."

primary_metric: test_ev_per_r
decision_gate:                  # roadmap §9 P1, evaluated ONCE on sealed test
  go: ev_per_r > 0 AND ev_ci_95_lo > -0.05 AND n_signals >= 30
  hold: CI straddles zero beyond +-0.05R, or n_signals < 30
  stop: ev_per_r <= -0.05 AND ci_hi < 0
variants_tried: []              # append every threshold/cost/feature variant, Issue A

controls:                       # byte-identical to production notebook (NOT changed)
  base_notebook: notebooks/eurusd/eurusd_buy_improved.ipynb
  split:                         # ACTUAL BUY production splits (verified 2026-09-21) —
                                 # DIFFER from SELL (EXP-2026-05); test window is
                                 # 2026-04-01 -> present, NOT 2026-01-01.
    train: 2020-06-30 -> 2025-10-31
    val:   2025-11-01 -> 2026-03-31
    test:  2026-04-01 -> present
  label_params:
    forward_bars: 6
    atr_period: 14
    atr_tp_mult: 1.5
    atr_sl_mult: 1.0
  label_semantics: "BUY keeps its NaN convention (ambiguous + timeout bars are
    EXCLUDED from training, not forced to 0) — unchanged from production."
  calibration: isotonic
  cv: purged expanding TimeSeriesSplit, PURGE_DAYS=30

changed_variable:               # the ONLY thing that differs from production
  label: cost_adjusted_v1
  cost_source: experiments/_core/costs.py (ROUND_TRIP_COST_PIPS)
  pair: EURUSD
  session: ALL                  # flat session multiplier (costs.py TODO)
  slippage: 0.0                 # unmeasured; roadmap §6.1 measurement pending

outputs:
  model_bundle: models/EURUSD_H1_buy_costlabel_<model>.joblib
  test_metrics: reports/test_metrics.json
  test_signals: reports/test_signals.csv