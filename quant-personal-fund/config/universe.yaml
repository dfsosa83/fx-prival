# Instrument Universe Definition
# The canonical list of instruments in the research universe.
# Loaded by core/instruments.py.
# To add an instrument: add it here AND in data/reference/instrument_master.csv.
# To remove an instrument: set is_active: false (do not delete — preserve history).

universe:
  fx:
    - ticker: EURUSD
      base_currency: EUR
      quote_currency: USD
      pip_value: 0.0001
      lot_size: 100000
      tick_size: 0.00001
      yahoo_ticker: "EURUSD=X"
      is_active: true

    - ticker: USDJPY
      base_currency: USD
      quote_currency: JPY
      pip_value: 0.01
      lot_size: 100000
      tick_size: 0.001
      yahoo_ticker: "USDJPY=X"
      is_active: true

    - ticker: GBPUSD
      base_currency: GBP
      quote_currency: USD
      pip_value: 0.0001
      lot_size: 100000
      tick_size: 0.00001
      yahoo_ticker: "GBPUSD=X"
      is_active: true

    - ticker: AUDUSD
      base_currency: AUD
      quote_currency: USD
      pip_value: 0.0001
      lot_size: 100000
      tick_size: 0.00001
      yahoo_ticker: "AUDUSD=X"
      is_active: true

    - ticker: USDCAD
      base_currency: USD
      quote_currency: CAD
      pip_value: 0.0001
