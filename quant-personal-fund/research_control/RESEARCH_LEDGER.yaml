    status: "REJECTED"
    reason: "OOS ADF, rolling stability and subperiod gates failed"
  - id: "G3-AUDNZD"
    formulation: "AUDUSD/NZDUSD H1 fixed-OLS residual mean reversion"
    status: "REJECTED"
    reason: "OOS ADF/Johansen/rolling stability gates failed"
  - id: "H4-C2"
    formulation: "EURUSD/USDCHF local rolling residual relationship"
    status: "REJECTED"
    reason: "Insufficient eligible validation windows"
  - id: "H5-v2"
    formulation: "Multi-pair USD momentum plus high-volatility continuation"
    status: "REJECTED"
    reason: "No paired strength/weakness BH-corrected validation survivor"
