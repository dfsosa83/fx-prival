project:
  name: "Forex and XAUUSD Quantitative Research"
  objective: "Establish statistically credible FX and XAUUSD hypotheses under frozen protocols, then separately evaluate economic viability with realistic costs, and only later consider execution."
  active_research_family: "H6_FAILED_BREAKOUT_INVALIDATION"

global_rules:
  timestamps: "INTERNAL_ORDINAL_NOT_UTC"
  immutable_snapshot_required: true
  exclude_max_available_label: true
  raw_data_imputation_allowed: false
  external_joins_allowed: false
  frozen_protocol_changes_after_results_allowed: false
  pnl_before_statistical_approval_allowed: false
  execution_before_explicit_authorization_allowed: false
  fx_xauusd_pooled_analysis_allowed: false

