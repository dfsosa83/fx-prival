# ═══════════════════════════════════════════════════════════════════════════
# OBSERVATION WINDOW (v3.4 — frozen correction to the v3.3 implementation cap)
# ═══════════════════════════════════════════════════════════════════════════
observation_window:
  rule: >
    Each original long episode begins at the already-defined next-bar-open
    long fill. Observe the episode for a MAXIMUM OF 20 CALENDAR DAYS after
    that entry timestamp.
  invalidation_definition: >
    A completed M15 solid-body close below the frozen support_at_entry.
  if_no_invalidation_within_20d: >
    Record reason code 'no_invalidation_within_observation_window'. Keep the
    episode in the complete ledger and report its count/rate by period. It is
    OUTSIDE the invalidation-conditioned A-vs-B population because no
    invalidation event occurred.
  prohibitions:
    - "Do not scan for, substitute, or use a later invalidation or C1."
    - "Do not tune or compare alternative observation-window lengths."
    - "Do not infer an outcome from this rule; episode-definition boundary only."
  timing_basis: "20 calendar days measured from ACTUAL ENTRY TIMESTAMP, not bar count"
  boundary_inclusion: "invalidation exactly at or before the 20-day boundary is INCLUDED"
  boundary_exclusion: "invalidation after the 20-day boundary is EXCLUDED and logged only as no_invalidation_within_observation_window"

# ═══════════════════════════════════════════════════════════════════════════
# REASON CODES (v3.4 — mutually exclusive and exhaustive)
# ═══════════════════════════════════════════════════════════════════════════
reason_codes_v34:
  - "c1_triggered"                                  # invalidated, C1 met, short opened
  - "no_c1"                                         # invalidated, C1 NOT met -> flat (in A-vs-B denominator)
  - "no_invalidation_within_observation_window"      # no invalidation in 20 calendar days -> OUTSIDE A-vs-B
  - "conservative_observed_window_exclusion_not_broker_confirmed"  # episode touches 22:30-02:00 UTC
  - "missing_bar_calendar_exclusion"                 # pre-registered missing-bar/gap rule exclusion
  - "rollover_ineligible"                            # C1 met but short entry ineligible (in denominator, flat)
  - "other_pre_registered"                           # any other pre-registered exclusion (coded explicitly)

reason_code_notes:
  obsolete_500bar: "no_invalidation_within_unfrozen_scan_cap"
  obsolete_500bar_handling: >
    The v3.3 implementation's 500-bar scan cap was NOT pre-registered and is
    REPLACED by the 20-calendar-day observation window. Episodes previously
    classified under the 500-bar cap are reclassified under v3.4 codes.
    The old label is preserved for traceability only.

# ═══════════════════════════════════════════════════════════════════════════
# POPULATION DEFINITION (v3.4)
# ═══════════════════════════════════════════════════════════════════════════
population:
  complete_ledger: "all original long episodes (every next-bar-open long fill)"
  avsb_eligible: "invalidated episodes ONLY (invalidation within 20d, not excluded by session/missing-bar rules)"
  avsb_denominator: "avsb_eligible episodes: c1_triggered + no_c1 + rollover_ineligible"
  outside_avsb: "no_invalidation_within_observation_window (no invalidation occurred)"

