# Experiment Manifest
# Pre-registered before any code touches the sealed test set.
# All fields are frozen after pre-registration.
# The inputs_hash is computed from frozen inputs and verified before scoring.
#
# PRE-REGISTRATION ONLY. Nothing here asserts that data, costs, or any
# statistical condition has been verified. No computation has been performed.

experiment:
  id: "QPF-RV-2026-01-EURUSD-GBPUSD-COINTEGRATION"
  status: "preregistered"
  created: "2026-09-29"
  researcher: ""

# Program scope: LEGACY_FRIVAL_ML | QPF_PLATFORM | FUTURE_QPF
program_scope: FUTURE_QPF

hypothesis:
  economic_mechanism: >-
    Relative-value hypothesis: EURUSD and GBPUSD share a USD leg, which can be
    removed by a hedge-ratio-adjusted log-price spread, leaving a EUR-GBP
    relative-value series whose deviations from a stable long-run relationship
    may mean-revert. The economic rationale is a candidate to be tested, not an
    assumption: common macro drivers and liquidity provision may keep relative
    value anchored, but this must be demonstrated empirically.
  falsifiable_claim: >-
    Under pre-registered tests, the hedge-ratio-adjusted spread
    s_t = log(EURUSD_t) - beta_t * log(GBPUSD_t), with beta_t estimated using
    only information available before t, is stationary/cointegrated and
    mean-reverting out of sample to a degree that is statistically credible and
    economically large enough to justify a later cost-aware two-leg backtest.
  why_existing_results_do_not_already_reject_it: >-
    This hypothesis is not covered by any closed family. The legacy program
    closed DIRECTIONAL H1 FX ML under a triple-barrier hit/miss label (Family 1)
    and FX crosses as diversification under that same directional label
    (Family 2). This experiment is a two-leg relative-value study whose target
    is spread stationarity and mean reversion, not a directional one-leg
    classifier, and it does not reuse the triple-barrier label. It is not a gold
    rule-engine variation and not an invalidation-reversal follow-up. See
    docs/falsification_ledger/no_edge_map.md,
    docs/falsification_ledger/LEGACY_INDEX.md, and experiments/REGISTRY.md.

universe:
  instruments:
    - "EURUSD"
    - "GBPUSD"
  data_source: "TBD (not selected or verified at pre-registration)"
  frequency: "TBD (not decided at pre-registration)"
  date_range:
    start: ""
    end: ""

signal:
  definition: >-
    Candidate spread s_t = log(P_t_EURUSD) - beta_t * log(P_t_GBPUSD), where
    beta_t is estimated using only information available before time t. No
    estimation method, window, or entry/exit policy is pre-specified here beyond
    the past-only constraint.
  directionality: "long_short (candidate spread only; not an approved signal)"
  holding_horizon: "TBD"
  rebalance_frequency: "TBD"
  parameters: {}

cost_model:
  # All costs are TWO-LEG costs. No cost values are pre-registered.
  legs: 2
  spread_source: ""
  slippage_assumption: ""
  commission: ""
  financing: ""
  session_conditioning: ""
  note: >-
    No fabricated cost values. G2_COST_EVIDENCE must establish measured or
    documented two-leg inputs (bid/ask or spread evidence, commissions,
    slippage model, swap/rollover convention, order/execution assumptions)
    before any economic evaluation.

portfolio:
  construction_method: ""
  risk_budget: {}
  vol_target: null
  constraints: {}

validation:
  train_window: ""
  validation_window: ""
  sealed_test_window: ""
  embargo_rule: "TBD"
  bootstrap_method: "moving_block"
  bootstrap_resamples: 1000
  note: "Windows are not set at pre-registration; no parameter search against a sealed test window is permitted."

metrics:
  primary_metric: "statistical_viability (spread stationarity / cointegration); economic EV is deferred to G5/G6"
  secondary_metrics: []
  minimum_sample_size: 30
  note: "minimum_sample_size is a placeholder carried from the template and must be finalized during G1/G3 design."

decision_gate:
  go: "Not applicable at pre-registration. Advancement is governed solely by the G0..G6 stage gates below."
  hold: "Not applicable at pre-registration."
  stop: "Any stage gate whose failure_decision is STOP halts the experiment."

robustness:
  checks:
    - remove_top_trades             # Remove top 1, 3, 5 trades
    - year_by_year                  # Per-year decomposition
    - quarter_by_quarter            # Per-quarter decomposition (if n permits)
    - regime_split                  # Split by market regime
    - cost_stress                   # 2x spread, 2x slippage stress
    - parameter_stability           # Perturb key parameters +/-20%
    - concentration_analysis        # PnL concentration by trade/period
    - unconditional_baseline        # Compare vs. unconditional asset drift

inputs:
  data_manifests: []                # References to data/raw/manifests/*.yaml
  config_snapshot: ""               # Git commit hash at pre-registration
  inputs_hash: ""                   # SHA256 of frozen parameters + data manifest refs

# Research lineage. `materially_distinct_from` is MANDATORY when this experiment
# is adjacent to a STOP/CLOSED experiment: cite the closed experiment(s) and state
# the material distinction (different mechanism / information source / hypothesis
# class), not a parameter, threshold, or time-frame change.
lineage:
  family: RV
  parent_experiments: []
  supersedes: []
  no_edge_ledger_references:
    - docs/falsification_ledger/no_edge_map.md
    - docs/falsification_ledger/LEGACY_INDEX.md
    - experiments/REGISTRY.md
  materially_distinct_from:
    - legacy directional H1 FX ML experiments
    - EXP-2026-04-RULEENGINE-FX-BACKTEST
    - EXP-2026-05-INVALIDATION-REVERSAL

# Traceability pointers to the artifacts that make this experiment reconstructable.
traceability:
  data_manifest_paths: []
  cost_assumption_paths: []
  code_paths: []
  notebook_paths: []
  report_paths: []
  decision_paths: []

# Pre-registered stage gates. Every gate is NOT_RUN at pre-registration.
stage_gates:
  G0_EXECUTION_ISOLATION:
    purpose: >-
      Ensure research code remains isolated from execution, broker, MT5,
      credentials, and network side effects.
    evidence_required: >-
      Passing static isolation guard and review of future code paths before
      execution.
    pass_criterion: >-
      The static isolation guard passes and future code paths introduce no
      broker/MT5/credential/network access.
    failure_decision: "STOP"
    pass_authorizes: "Data-audit planning only."
    status: "NOT_RUN"
  G1_DATA_AUDIT:
    purpose: >-
      Determine whether synchronized EURUSD and GBPUSD data are available with
      documented source, field semantics, timeframe, coverage, timezone,
      missingness, and timestamp alignment.
    evidence_required: "A versioned data manifest and an audit report."
    pass_criterion: >-
      A versioned data manifest and audit report document source, field
      semantics, timeframe, coverage, timezone, missingness, and timestamp
      alignment for both instruments.
    failure_decision: "PAUSE if data can be obtained later; STOP if fundamentally unusable."
    pass_authorizes: "Cost-evidence audit only."
    status: "NOT_RUN"
  G2_COST_EVIDENCE:
    purpose: "Establish measured or documented two-leg cost inputs."
    evidence_required: >-
      Bid/ask or spread evidence, commissions, slippage model, swap/rollover
      convention, and order/execution assumptions.
    pass_criterion: >-
      All required two-leg cost components are documented with a stated source;
      no value is fabricated.
    failure_decision: "PAUSE"
    pass_authorizes: "Statistical viability tests only."
    explicit_rule: "No fabricated cost values and no claim of tradability at this stage."
    status: "NOT_RUN"
  G3_COINTEGRATION_STATIONARITY:
    purpose: >-
      Test whether the pre-defined spread relationship is statistically
      credible out of sample.
    evidence_required: >-
      Engle-Granger/ADF and Johansen where the sample design supports it; rolling
      stability analysis of beta and stationarity.
    pass_criterion: >-
      The pre-registered stationarity/cointegration tests are satisfied out of
      sample with stable beta and stationarity diagnostics.
    failure_decision: "STOP"
    pass_authorizes: "Mean-reversion diagnostics only."
    explicit_rule: "No parameter search against a sealed test window."
    status: "NOT_RUN"
  G4_MEAN_REVERSION:
    purpose: >-
      Determine whether the spread behavior is consistent with a practically
      relevant mean-reversion mechanism.
    evidence_required: >-
      Half-life diagnostics, variance-ratio tests, and regime and subperiod
      stability.
    pass_criterion: >-
      Mean-reversion diagnostics indicate a practically relevant reversion
      mechanism that is stable across regimes and subperiods.
    failure_decision: "STOP"
    pass_authorizes: "Economic-viability screening only."
    status: "NOT_RUN"
  G5_ECONOMIC_VIABILITY:
    purpose: >-
      Determine whether observed spread dislocations can plausibly exceed the
      total estimated two-leg round-trip cost.
    evidence_required: >-
      Cost-aware descriptive screening; no optimized strategy and no production
      backtest.
    pass_criterion: >-
      Spread dislocations plausibly exceed the total estimated two-leg
      round-trip cost under conservative assumptions.
    failure_decision: "STOP"
    pass_authorizes: "A separately approved cost-aware backtest phase only."
    explicit_rule: "A stationary spread alone is insufficient."
    status: "NOT_RUN"
  G6_COST_AWARE_BACKTEST:
    purpose: >-
      Later, separately authorized walk-forward simulation of a fixed,
      pre-registered entry/exit policy.
    evidence_required: >-
      Bid/ask-aware or conservatively modeled fills, entry and exit costs for
      both legs, commissions, slippage, swaps, no look-ahead, chronological
      train/validation/sealed-test design, robustness checks, and net EV results.
    pass_criterion: >-
      A pre-registered policy produces positive net EV after all two-leg costs
      across the sealed test design and robustness checks.
    failure_decision: "STOP"
    pass_authorizes: >-
      No deployment automatically; at most a separate governance decision about
      a shadow phase.
    status: "NOT_RUN"

preregistered_constraints:
  - "No data work is authorized by this manifest alone."
  - "No model, ML filter, threshold tuning, or LLM validation is authorized by this manifest alone."
  - "Any ML phase requires a separate explicit approval and must use the existing EURUSD methodology contract: chronological train/validation/sealed test, purged temporal CV, recency weighting inside training folds, synthetic-noise feature controls, PR-AUC, probability calibration, validation-only threshold selection, and cost-adjusted sealed-test evaluation."
  - "All costs must be treated as two-leg costs."
  - "The future backtest must compare against a no-trade baseline and must not assume stationarity implies profitability."
  - "No execution, demo, shadow, or live transition is authorized."

non_goals:
  - "Directional one-leg H1 FX classification."
  - "Any reopening of the legacy directional H1 FX ML family or the FX-crosses-under-directional-label family."
  - "Any follow-up to EXP-2026-05-INVALIDATION-REVERSAL (CLOSED/STOP)."
  - "Parameter search, threshold tuning, or model/ML development."
  - "Execution, demo, shadow, or live deployment."
  - "Any claim of tradability or edge from stationarity/cointegration alone."
