# Experiment Manifest
# Pre-registered before any code touches the sealed test set.
# All fields are frozen after pre-registration.
# The inputs_hash is computed from frozen inputs and verified before scoring.

experiment:
  id: "EXP-YYYY-NN-NAME"            # Unique ID. Future QPF: QPF-<FAMILY>-<YEAR>-<SEQUENCE>-<SLUG>
  status: "preregistered"           # preregistered | in_progress | completed | closed
  created: "YYYY-MM-DD"             # Date of pre-registration
  researcher: ""                    # Researcher identifier

# Program scope: LEGACY_FRIVAL_ML | QPF_PLATFORM | FUTURE_QPF
program_scope: FUTURE_QPF

hypothesis:
  economic_mechanism: ""            # Why should this signal work?
  falsifiable_claim: ""             # Specific, testable claim
  why_existing_results_do_not_already_reject_it: ""
                                    # Citation of falsification ledger

universe:
  instruments: []                   # List of instrument tickers
  data_source: ""                   # e.g. yahoo_finance
  frequency: ""                     # daily | weekly | monthly
  date_range:
    start: ""                       # YYYY-MM-DD
    end: ""                         # YYYY-MM-DD

signal:
  definition: ""                    # Mathematical or algorithmic definition
  directionality: ""                # long_only | short_only | long_short
  holding_horizon: ""               # Expected holding period
  rebalance_frequency: ""           # daily | weekly | monthly
  parameters: {}                    # Frozen parameter values

cost_model:
  spread_source: ""                 # Source and date of spread measurements
  slippage_assumption: ""           # Assumed slippage
  commission: ""                    # Commission structure
  financing: ""                     # Swap/financing assumptions
  session_conditioning: ""          # Session-conditioned costs (if any)

portfolio:
  construction_method: ""           # inverse_volatility | risk_parity | equal_weight
  risk_budget: {}                   # Risk budget per sleeve/instrument
  vol_target: null                  # Annualized vol target (e.g. 0.10)
  constraints: {}                   # Position limits, concentration limits

validation:
  train_window: ""                  # "YYYY-MM-DD to YYYY-MM-DD"
  validation_window: ""             # "YYYY-MM-DD to YYYY-MM-DD"
  sealed_test_window: ""            # "YYYY-MM-DD to YYYY-MM-DD" — scored once
  embargo_rule: ""                  # Purge period between train and test
  bootstrap_method: "moving_block"  # moving_block
  bootstrap_resamples: 1000         # Number of resamples

metrics:
  primary_metric: ""                # e.g. net_ev_per_r, sharpe_ratio
  secondary_metrics: []             # Additional metrics
  minimum_sample_size: 30           # Minimum trades/periods for valid inference

decision_gate:
  go: ""                            # Conditions for GO
  hold: ""                          # Conditions for HOLD
  stop: ""                          # Conditions for STOP

robustness:
  checks:
    - remove_top_trades             # Remove top 1, 3, 5 trades
    - year_by_year                  # Per-year decomposition
    - quarter_by_quarter            # Per-quarter decomposition (if n permits)
    - regime_split                  # Split by market regime
    - cost_stress                   # 2× spread, 2× slippage stress
    - parameter_stability           # Perturb key parameters ±20%
    - concentration_analysis        # PnL concentration by trade/period
    - unconditional_baseline        # Compare vs. unconditional asset drift

inputs:
  data_manifests: []                # References to data/raw/manifests/*.yaml
  config_snapshot: ""               # Git commit hash at pre-registration
  inputs_hash: ""                   # SHA256 of frozen parameters + data manifest refs
                                    # Computed at pre-registration, verified before scoring

# Research lineage. `materially_distinct_from` is MANDATORY when this experiment is adjacent to
# a STOP/CLOSED experiment: cite the closed experiment(s) and state the material distinction
# (different mechanism / information source / horizon / evaluation framework) — not a parameter,
# threshold, or time-frame change. See docs/falsification_ledger/LEGACY_INDEX.md.
lineage:
  family: null                      # Family code/label (e.g. RV, MR, CRYPTO, TREND, CARRY)
  parent_experiments: []            # Direct predecessor experiment IDs
  supersedes: []                    # Experiment IDs this one supersedes
  no_edge_ledger_references: []     # docs/falsification_ledger/no_edge_map.md families/entries
  materially_distinct_from: []      # MANDATORY vs adjacent STOP/CLOSED experiment IDs

# Traceability pointers to the artifacts that make this experiment reconstructable.
traceability:
  data_manifest_paths: []           # data/raw/manifests/*.yaml
  cost_assumption_paths: []         # e.g. config/cost_model.yaml
  code_paths: []                    # signal/portfolio/runner modules
  notebook_paths: []                # exploratory notebooks (if any)
  report_paths: []                  # generated reports
  decision_paths: []                # docs/decisions/DECISION_LOG.md entries

non_goals:
  - ""                              # What this experiment explicitly does NOT test