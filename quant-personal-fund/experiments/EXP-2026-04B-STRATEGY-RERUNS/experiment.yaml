# ═══════════════════════════════════════════════════════════════════════════
# HISTORICAL GATES (literal; no substitution of Benchmark B values)
# ═══════════════════════════════════════════════════════════════════════════
historical_gates:
  EXP_2026_03:  # LITERAL, unchanged. ONLY source of the GO/HOLD/STOP verdict.
    go: "full_period_sharpe >= 0.55 AND max_drawdown > -0.167 AND cost_to_gross_pnl < 0.545"
    hold: "full_period_sharpe between 0.40 and 0.55 OR any one GO condition missed"
    stop: "full_period_sharpe < 0.40 OR max_drawdown <= -0.167 OR cost_to_gross_pnl >= 0.545"
    note: >
      Absolute thresholds 0.55 / -0.167 / 0.545 are applied literally.
      Benchmark B values are NEVER substituted into these thresholds.
  EXP_2026_01:
    go: "net sharpe > baseline sharpe + 0.10 AND max_drawdown < baseline max_drawdown"
    hold: "net sharpe within baseline sharpe +/- 0.10"
    stop: "net sharpe < baseline sharpe - 0.10 OR max_drawdown > baseline max_drawdown"
    note: >
      Relative-gate FORM preserved verbatim. Benchmark B used only as the
      corrected-accounting baseline comparator. Labeled as a corrected-
      accounting re-evaluation, not a rewrite of the historical verdict.
  trend_sleeve:
    note: "No sealed historical GO/HOLD/STOP gate. Reported as comparison statement only."

# ═══════════════════════════════════════════════════════════════════════════
# COMPARATORS
# ═══════════════════════════════════════════════════════════════════════════
comparators:
  primary: "Benchmark B (economically implemented; sole gate baseline)"
  analytical_exposure_matched:
    formula: "R_EM[t] = g_lagged[t] * R_B[t] + (1 - g_lagged[t]) * R_cash[t]"
    g_lagged: "sleeve gross exposure known before return interval t (1-day lag)"
    R_B: "Benchmark B net return"
    R_cash: "0.0 (rf=0 convention)"
    label: "Analytical Exposure-Matched Reference — non-tradeable"
    constraints:
      - "NO transaction costs, turnover, trades, execution claims, or separate economic NAV"
      - "NOT a GO/HOLD/STOP gate target"
      - "Use ONLY to decompose asset-selection vs exposure-timing effects"
      - "Benchmark B remains the only economically implemented benchmark"

# ═══════════════════════════════════════════════════════════════════════════
# FINANCING SENSITIVITY (runtime multipliers only; no config edits)
# ═══════════════════════════════════════════════════════════════════════════
financing_scenarios:
  A: {multiplier: 0.0, purpose: "financing-free reference"}
  B: {multiplier: 1.0, purpose: "PRIMARY scenario and ONLY verdict basis"}
  C: {multiplier: 0.5, purpose: "downside sensitivity"}
  D: {multiplier: 1.5, purpose: "upside sensitivity"}
  rules:
    - "financing charged ONLY through daily holding cost (H1-corrected)"
    - "config/cost_model.yaml NOT modified; multipliers applied at runtime"
    - "Scenario B is the only verdict basis; A/C/D are sensitivity only"

statistics:
