# Experiment Registry — machine-readable companion to REGISTRY.md
# Governance reference only. Reserves nothing; creates no experiment folder.
# Fields mirror docs/governance/EXPERIMENT_MANIFEST_SPEC.md where applicable.

registry:
  version: 1
  purpose: "Identifier governance: prevent reuse of historical experiment IDs and define the future QPF namespace."
  historical_id_scheme: "EXP-2026-xx (ambiguous across programs; always qualify with program_scope)"
  future_id_scheme: "QPF-<FAMILY>-<YEAR>-<SEQUENCE>-<SLUG>"
  canonical_identifier_rule: >-
    Use `id` for FUTURE_QPF records and `historical_id` for
    LEGACY_FRIVAL_ML and QPF_PLATFORM records.
  legacy_ids_immutable: true
  program_scopes:
    - LEGACY_FRIVAL_ML
    - QPF_PLATFORM
    - FUTURE_QPF
  # The identifiers below are illustrative only and are NOT reserved.
  # Reserved future-QPF identifiers are represented exclusively in the
  # `experiments` list below, with program_scope: FUTURE_QPF.
  future_examples_not_reserved:
    - "QPF-MR-2026-01-FX-INTRADAY-OVEREXTENSION"
    - "QPF-CRYPTO-2026-01-PERP-BASIS-FUNDING"

