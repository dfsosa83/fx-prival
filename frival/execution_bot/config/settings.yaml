# Frival Order Execution Bot — Trading Configuration
# Copy DeafAgent config/credentials.env contents if you want to reuse existing setup.

trading:
  mode: demo                     # demo or live — DEMO (paper, 7409623) per operator decision 2026-09-18
  default_risk_profile: MODERATE # VERY_CONSERVATIVE through VERY_AGGRESSIVE
  default_lot_size: 0.08

# EXEC-D1 terminal execution — AUTHORIZED 2026-09-29 (project owner).
# Real orders are sent to the FP Markets DEMO terminal (FPMarketsSC-Demo,
# account 7409623, $5,000 demo) for ALL pairs.
# entry_semantics: reanchor (owner decision 2026-09-29) -> market-enter at the
# first in-window tick and set SL/TP from the SIGNAL'S PIP DISTANCES measured on
# the ACTUAL fill (preserves R:R; removes the fixed +-2-pip close-zone latency
# dependence that caused 0 fills). entry_semantics: zone keeps the legacy
# in-zone / <=10-min zone-touch behavior.
# The legacy order bot delegates to run_exec_d1_terminal.py when enabled; it
# does NOT double-consume signals and does not send orders.
execution:
  enabled: true                  # EXEC-D1 terminal runner is the entry path
  entry_semantics: reanchor      # zone | reanchor (SL/TP re-anchored on the fill)
  terminal_scope: demo           # demo terminal only (no live account ever)
  confirm_orders: false          # automated demo testing (owner decision 2026-09-29)

mt5:
  timeout: 30                    # connection timeout seconds
  retries: 3                     # connection retry attempts
  timezone: America/Panama       # your local timezone

# ── Per-Pair Execution Rules ────────────────────────────────────────
# signal_watcher reads Frival JSONL. order_bot checks these rules.
# Set shadow: true to monitor only (no real orders placed).

pairs:
  EURUSD:
    direction: SELL
    lot_size: 0.08
    shadow: false               # LIVE — EV positive, deployed gate passed
  GBPUSD:
    direction: SELL
    lot_size: 0.08
    shadow: false               # LIVE — EV -0.019R, monitoring
  USDCHF:
    direction: SELL
    lot_size: 0.04
    shadow: false               # LIVE — EV -0.014R, monitoring
  USDCAD:
    direction: SELL
    lot_size: 0.08
    shadow: false               # LIVE — EV -0.114R, shadow-worthy

# ── Risk Controls ───────────────────────────────────────────────────
risk:
  max_daily_loss: 100.0           # $ max loss per day = 2% of $5,000 demo (7409623)
                                  # operator decision 2026-09-21: sized above the
                                  # ~$6/trade daily swing so it protects without
                                  # ending test days early (roadmap §6.2).
  max_positions_per_pair: 1      # never pyramid on the same symbol
  max_total_positions: 4         # across all pairs

# ── Order Settings ──────────────────────────────────────────────────
orders:
  deviation_points: 5            # max price deviation for market orders
  dynamic_sizing: false          # use fixed lot sizes from pair config
  pending_order_timeout: 600     # seconds before pending orders expire

# ── Break-Even Monitor ───────────────────────────────────────────────
# After an order is placed, monitors the position and moves SL to
# entry price when the market covers 50% of the distance to TP1.
# This guarantees a zero-loss trade if price subsequently reverses.
break_even:
  enabled: true                  # set to false to disable the monitor
  max_wait_seconds: 600          # max polling duration (10 min)
  poll_interval_seconds: 30      # check price every 30 seconds

# ── Security ────────────────────────────────────────────────────────
security:
  confirm_live_orders: true      # require confirmation before live orders
  emergency_controls:
    enabled: true
    stop_file: ../frival/data/emergency_stop.txt